<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Page header" style="background:linear-gradient(180deg,var(--mint) 0%,var(--white) 100%)">
  <div style="max-width:1160px;margin:0 auto;padding:40px 32px 56px;display:flex;flex-direction:column;gap:18px">
    <nav aria-label="Breadcrumb" style="display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--stone)">
      <a href="index.html">Home</a><span aria-hidden="true">/</span>
      <sc-if value="{{ hasParent }}" hint-placeholder-val="{{ false }}"><a href="{{ parentHref }}">{{ parentLabel }}</a><span aria-hidden="true">/</span></sc-if>
      <span aria-current="page" style="color:var(--ink)">{{ crumb }}</span>
    </nav>
    <p style="margin:12px 0 0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--teal-text)">{{ eyebrow }}</p>
    <h1 style="margin:0;font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:-0.035em;font-size:clamp(36px,4.6vw,54px);line-height:1.04;color:var(--ink);text-wrap:balance">{{ title }}</h1>
    <sc-if value="{{ hasIntro }}" hint-placeholder-val="{{ true }}">
      <p style="margin:0;font-size:19px;font-weight:500;line-height:1.45;color:var(--ink);max-width:680px;text-wrap:pretty">{{ intro }}</p>
    </sc-if>
    <sc-if value="{{ hasLinks }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="3">
          <a href="{{ l.href }}" style="padding:10px 18px;border-radius:999px;background:var(--white);border:1px solid var(--border-strong);color:var(--ink);font-size:14px;font-weight:600;transition:background-color 150ms ease-out,border-color 150ms ease-out" style-hover="background:var(--mint);border-color:var(--teal-text);color:var(--teal-text)">{{ l.label }}</a>
        </sc-for>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;340px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,href:string}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const links = p.links || [];
    return {
      crumb: p.crumb ?? p.title ?? '', title: p.title ?? 'Page title', eyebrow: p.eyebrow ?? p.crumb ?? '',
      intro: p.intro ?? '', hasIntro: !!p.intro,
      parentLabel: p.parentLabel, parentHref: p.parentHref ?? '#', hasParent: !!p.parentLabel,
      links, hasLinks: links.length > 0,
    };
  }
}
</script>
</body>
</html>
